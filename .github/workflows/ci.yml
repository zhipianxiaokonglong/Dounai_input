name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Format check
        run: ruff format --check src tests examples
      - name: Test
        run: pytest -q

  package:
    name: build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Build
        run: python -m build
      - name: Verify package data
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "dounai_input/web/index.html",
              "dounai_input/web/app.css",
              "dounai_input/web/app.js",
              "dounai_input/web/favicon.svg",
              "dounai_input/resources/privacy_policy_zh.md",
          }
          missing = required - names
          assert not missing, f"missing package data: {sorted(missing)}"
          print(f"wheel has {len(names)} files and all required data")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dounai-input-dist
          path: dist/
